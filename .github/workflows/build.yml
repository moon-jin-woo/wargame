name: build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build

      - name: Prepare Pages entry
        run: mv dist/app.html dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Sync branch-source Pages snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf assets data
          cp dist/index.html index.html
          cp -R dist/assets assets
          cp -R dist/data data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets data
          if git diff --cached --quiet; then
            echo "Pages snapshot already current."
          else
            git commit -m "chore: publish built site snapshot [skip ci]"
            git push origin HEAD:main
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
