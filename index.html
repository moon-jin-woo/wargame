<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f141a" />
    <title>Wargame</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0f14;
        color: #edf2f7;
      }
      main {
        width: min(520px, 100%);
        padding: 24px;
        border: 1px solid #2c3947;
        border-radius: 12px;
        background: #121820;
      }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #95a5b5; line-height: 1.6; }
      small { display: block; margin-top: 14px; color: #667789; }
    </style>
  </head>
  <body>
    <main>
      <h1>Wargame 배포 준비 중</h1>
      <p>최신 게임 빌드가 GitHub Pages에 반영되는 중입니다. 잠시 후 자동으로 다시 확인합니다.</p>
      <small>페이지가 계속 이 상태라면 새로고침해 주세요.</small>
    </main>
    <script>
      window.setTimeout(() => window.location.reload(), 8000)
    </script>
  </body>
</html>
